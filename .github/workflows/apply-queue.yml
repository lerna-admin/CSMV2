name: Apply CSMV2 Queue

on:
  push:
    branches: [main]
    paths:
      - 'data/queue/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/process-queue.mjs
      - name: Commit materialized data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/users data/sites data/templates data/queue
          git commit -m "chore: apply queue" || exit 0
          git push
